# https://docs.spring.io/spring-ai/reference/api/mcp/mcp-server-boot-starter-docs.html#_webflux_server_configuration

# logging:
#   level:
#     org.springframework.security: TRACE

# Using spring-ai-starter-mcp-server-webflux
spring:
  ai:
    mcp:
      server:
        name: github-mcp-server
        version: 1.0.0
        type: ASYNC  # Recommended for reactive applications
        sse-message-endpoint: /mcp/messages

  security:
    oauth2:
      resourceserver:
        # for Authentication by Bearer Token
        opaquetoken:
          # MCP Inspector (Dynamic Client Registration)
          client-id: 
          client-secret: 
        jwt:
          issuer-uri: https://dev-xxx.jp.auth0.com/
      client:
        registration:
          auth0:
            provider: auth0
            # MCP Inspector (Dynamic Client Registration)
            client-id: 
            client-secret: 
            scope: openid, profile, email
            # authorization-grant-type: authorization_code
            # redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          auth0:
            issuer-uri: https://dev-xxx.jp.auth0.com/
            # authorization-uri: https://dev-xxx.jp.auth0.com
            # token-uri: https://YOUR_AUTH0_DOMAIN/oauth/token
            # user-info-uri: https://YOUR_AUTH0_DOMAIN/userinfo
            # user-name-attribute: sub
            # jwk-set-uri: https://YOUR_AUTH0_DOMAIN/.well-known/jwks.json
